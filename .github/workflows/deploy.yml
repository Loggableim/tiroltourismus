name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: de
            project: tiroltourismus-de
          - lang: en
            project: tiroltourismus-en
          - lang: fr
            project: tiroltourismus-fr
          - lang: cs
            project: tiroltourismus-cs
          - lang: nl
            project: tiroltourismus-nl
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BUILD_LANGS: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Stash DE pages (non-DE builds)
        run: node scripts/prepare-build.mjs

      - name: Build search index
        run: npm run build:search-index

      - name: Build static site
        run: npm run build:astro

      - name: Restore DE pages
        if: always()
        run: node scripts/prepare-build.mjs --restore

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ matrix.project }} --branch=${{ github.ref_name }}

  deploy-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install landing dependencies
        working-directory: landing
        run: npm install --no-audit --no-fund

      - name: Build landing
        working-directory: landing
        run: npm run build

      - name: Deploy landing to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing/dist --project-name=tiroltourismus --branch=${{ github.ref_name }}
