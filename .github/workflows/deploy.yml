name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: de
            project: tiroltourismus-de
          - lang: en
            project: tiroltourismus-en
          - lang: fr
            project: tiroltourismus-fr
          - lang: cs
            project: tiroltourismus-cs
          - lang: nl
            project: tiroltourismus-nl
          - lang: it
            project: tiroltourismus-it
          - lang: es
            project: tiroltourismus-es
          - lang: zh
            project: tiroltourismus-zh
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BUILD_LANGS: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Stash DE pages (non-DE builds)
        run: node scripts/prepare-build.mjs

      - name: Generate robots.txt
        run: node scripts/generate-robots.mjs

      - name: Build search index
        run: npm run build:search-index

      - name: Build static site
        run: npm run build:astro

      - name: Restore DE pages
        if: always()
        run: node scripts/prepare-build.mjs --restore

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The static build is fine. Publishing the Pages Function fails
          # intermittently on Cloudflare ("Unknown internal error",
          # "malformed response") when eight projects deploy at once.
          # The failing language changes every run, so retry the same upload.
          set -uo pipefail
          attempt=1
          max=3
          until npx --yes wrangler@4.149.0 pages deploy dist \
            --project-name="${{ matrix.project }}" \
            --branch="${{ github.ref_name }}" \
            --commit-dirty=true
          do
            if [ "$attempt" -ge "$max" ]; then
              echo "deploy failed after ${max} attempts"
              exit 1
            fi
            echo "deploy attempt ${attempt} failed, retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 20))
          done

  deploy-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install landing dependencies
        working-directory: landing
        run: npm install --no-audit --no-fund

      - name: Build landing
        working-directory: landing
        run: npm run build

      - name: Deploy landing to Cloudflare Pages
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          attempt=1
          max=3
          until npx --yes wrangler@4.149.0 pages deploy dist \
            --project-name=tiroltourismus \
            --branch="${{ github.ref_name }}" \
            --commit-dirty=true
          do
            if [ "$attempt" -ge "$max" ]; then
              echo "landing deploy failed after ${max} attempts"
              exit 1
            fi
            echo "landing deploy attempt ${attempt} failed, retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 20))
          done
