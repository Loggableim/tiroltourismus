    (function() {
      const html = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      const sun = toggle?.querySelector('.theme-sun');
      const moon = toggle?.querySelector('.theme-moon');

      function setTheme(mode) {
        if (mode === 'alpenpeak') {
          html.setAttribute('data-theme', 'alpenpeak');
          if (sun) sun.style.display = 'none';
          if (moon) moon.style.display = 'block';
          try { localStorage.setItem('tirol_theme', 'alpenpeak'); } catch {}
        } else {
          html.removeAttribute('data-theme');
          if (sun) sun.style.display = 'block';
          if (moon) moon.style.display = 'none';
          try { localStorage.setItem('tirol_theme', 'day'); } catch {}
        }
      }

      try {
        const saved = localStorage.getItem('tirol_theme');
        if (saved === 'alpenpeak') setTheme('alpenpeak');
      } catch {}

      if (!localStorage.getItem('tirol_theme')) {
        const h = new Date().getHours();
        if (h >= 20 || h < 6) setTheme('alpenpeak');
      }

      if (toggle) {
        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          const isDark = html.getAttribute('data-theme') === 'alpenpeak';
          setTheme(isDark ? 'day' : 'alpenpeak');
        });
      }
    })();
  </script> </body> </html>
