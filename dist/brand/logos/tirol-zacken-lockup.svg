<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 4 420 50" width="420" height="50">
  <!-- TIROL ZACKEN Icon + tourismus – optimierte Spacing -->
  <defs>
    <linearGradient id="t1" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0%" stop-color="#A00D24"/><stop offset="100%" stop-color="#C8102E"/></linearGradient>
    <linearGradient id="t2" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0%" stop-color="#C0006E"/><stop offset="100%" stop-color="#FF1493"/></linearGradient>
    <linearGradient id="t3" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0%" stop-color="#D4A800"/><stop offset="100%" stop-color="#FFD700"/></linearGradient>
    <linearGradient id="t4" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0%" stop-color="#C0006E"/><stop offset="100%" stop-color="#FF1493"/></linearGradient>
    <linearGradient id="t5" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0%" stop-color="#003A8A"/><stop offset="100%" stop-color="#0066FF"/></linearGradient>
  </defs>
  <!-- T-I-R-O-L – optisch gleichmäßig gesetzt -->
  <text x="10" y="38" font-family="'Bebas Neue','Impact','Arial Narrow',sans-serif" font-size="36" font-weight="bold" fill="url(#t1)">T</text>
  <polygon points="10,36 10,10 34,36" fill="url(#t1)" opacity="0.08"/>
  <text x="42" y="38" font-family="'Bebas Neue','Impact','Arial Narrow',sans-serif" font-size="36" font-weight="bold" fill="url(#t2)">I</text>
  <polygon points="42,36 42,14 56,36" fill="url(#t2)" opacity="0.08"/>
  <text x="68" y="38" font-family="'Bebas Neue','Impact','Arial Narrow',sans-serif" font-size="36" font-weight="bold" fill="url(#t3)">R</text>
  <polygon points="68,36 68,8 92,36" fill="url(#t3)" opacity="0.08"/>
  <text x="100" y="38" font-family="'Bebas Neue','Impact','Arial Narrow',sans-serif" font-size="36" font-weight="bold" fill="url(#t4)">O</text>
  <polygon points="100,36 100,10 126,36" fill="url(#t4)" opacity="0.08"/>
  <text x="134" y="38" font-family="'Bebas Neue','Impact','Arial Narrow',sans-serif" font-size="36" font-weight="bold" fill="url(#t5)">L</text>
  <polygon points="134,36 134,8 158,36" fill="url(#t5)" opacity="0.08"/>
  <!-- Punkt als Trenner -->
  <circle cx="172" cy="30" r="2.5" fill="rgba(0,0,0,0.12)"/>
  <!-- tourismus -->
  <text x="186" y="38" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="300" letter-spacing="0.8" fill="#C8102E">tourismus</text>
  <text x="388" y="38" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="rgba(0,0,0,0.15)">.com</text>
</svg>
